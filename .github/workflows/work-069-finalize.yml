name: WORK-069 post-merge finalization

on:
  push:
    branches:
      - governance/WORK-069-post-merge-finalization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/WORK-069-post-merge-finalization
          fetch-depth: 0

      - name: Reconcile canonical governance state
        env:
          MERGE_SHA: 62475bea2366e9377fe2fc42b57f58c639296974
          APPROVED_HEAD: 8ab2d6410d582642487f389ffd0ba010d729b559
          PR_NUMBER: "108"
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          MERGE_SHA = "62475bea2366e9377fe2fc42b57f58c639296974"
          APPROVED_HEAD = "8ab2d6410d582642487f389ffd0ba010d729b559"
          PR = 108
          NOW = "2026-09-01T05:40:42Z"

          def readj(p):
              return json.loads(Path(p).read_text())

          def writej(p, x):
              Path(p).write_text(json.dumps(x, indent=2) + "\n")

          # Canonical program state: program-state.json has no currentGeneration key.
          # Finalization updates the Work Order record, top-level asOf, and removes
          # the resumable handoff. Counts remain derived from workOrders.
          p = Path("spec/development-state/program-state.json")
          d = readj(p)
          matches = [w for w in d["workOrders"] if w.get("id") == "WORK-069"]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one WORK-069 record, found {len(matches)}")
          w = matches[0]
          w["status"] = "complete"
          w["mergedAs"] = {"pr": PR, "mergeCommit": MERGE_SHA}
          w.pop("branch", None)
          d["resumption"]["activeHandoffs"] = [
              h for h in d["resumption"].get("activeHandoffs", [])
              if h.get("workOrderId") != "WORK-069"
          ]
          d["asOf"] = (
              f"{NOW} (WORK-069 post-merge finalization: PR #{PR} merged as {MERGE_SHA}, "
              f"approved head {APPROVED_HEAD}; canonical WORK-069 is complete + finalized, "
              "its in-flight handoff is removed. Prior canonical narrative preserved as durable history.)"
          )
          writej(p, d)

          # Derived dependency state.
          p = Path("spec/development-state/dependency-state.json")
          d = readj(p)
          cg = d["currentGeneration"]
          cg["completedWorkOrders"] = 61
          cg["inFlight"] = []
          cg["note"] = (
              f"WORK-069 is COMPLETE + FINALIZED (PR #{PR}, merge {MERGE_SHA}, "
              f"approved head {APPROVED_HEAD}); its hard edge for WORK-070 is now satisfied."
          )
          d["currentGeneration"] = cg
          d["futureGeneration"].pop("WORK-069", None)
          d["futureGenerationEligibility"].pop("WORK-069", None)
          d["futureGenerationEligibility"]["WORK-070"] = (
              "eligible — WORK-067, WORK-069, and WORK-051 are complete; "
              "soft WORK-055 and WORK-060 remain non-hard dependencies."
          )
          writej(p, d)

          # Frontier state.
          p = Path("spec/development-state/frontier-state.json")
          d = readj(p)
          d["currentMain"] = MERGE_SHA
          d["plannedNext"] = [x for x in d.get("plannedNext", []) if x != "WORK-069"]
          if "WORK-068" not in d["plannedNext"] and d.get("currentLiveImplementation") != "WORK-068":
              d["plannedNext"].append("WORK-068")
          if "WORK-070" not in d["plannedNext"]:
              d["plannedNext"].append("WORK-070")
          d["computedAt"] = NOW + " (WORK-069 post-merge finalization)"
          writej(p, d)

          # Future roadmap.
          p = Path("spec/governance/future-roadmap.json")
          d = readj(p)
          if "sequence" in d:
              d["sequence"] = [x for x in d["sequence"] if x != "WORK-069"]
          if "waves" in d:
              newwaves = []
              for wave in d["waves"]:
                  items = [x for x in wave.get("items", []) if x != "WORK-069"]
                  if items:
                      nw = dict(wave)
                      nw["items"] = items
                      newwaves.append(nw)
              d["waves"] = newwaves
          marker = f"WORK-069 was finalized after PR #{PR} merged as {MERGE_SHA}"
          rule = d.get("rule", "")
          if marker not in rule:
              suffix = f" {marker}; its hard dependency edge for WORK-070 is satisfied."
              d["rule"] = rule.rstrip() + suffix
          writej(p, d)

          # Work-order record.
          p = Path("spec/work-orders/WORK-069.md")
          text = p.read_text()
          text = text.replace("Status: IN FLIGHT", "Status: COMPLETE + FINALIZED", 1)
          marker = "## Post-merge finalization (2026-09-01 — §34.8 / ADR-0007)"
          if marker not in text:
              text += (
                  f"\n\n{marker}\n\n"
                  f"PR #{PR} was merged as `{MERGE_SHA}` from approved head `{APPROVED_HEAD}`. "
                  f"The canonical Work Order state is now `complete` with `mergedAs {{pr: {PR}, mergeCommit: {MERGE_SHA}}}`. "
                  "Its active implementation handoff is removed because merged work is not resumable. "
                  "This finalization is governance-only: it does not alter runtime code, add migrations, "
                  "or activate WORK-070. Prior implementation evidence and review history remain preserved above.\n"
              )
          p.write_text(text)
          PY

      - name: Verify finalization state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("spec/development-state/program-state.json").read_text())
          w = next(w for w in d["workOrders"] if w["id"] == "WORK-069")
          assert w["status"] == "complete"
          assert w["mergedAs"]["pr"] == 108
          assert w["mergedAs"]["mergeCommit"] == "62475bea2366e9377fe2fc42b57f58c639296974"
          assert all(h.get("workOrderId") != "WORK-069" for h in d["resumption"].get("activeHandoffs", []))
          dep = json.loads(Path("spec/development-state/dependency-state.json").read_text())
          assert dep["currentGeneration"]["inFlight"] == []
          assert "WORK-070" in dep["futureGenerationEligibility"]
          print("WORK-069 finalization state verified")
          PY

      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/development-state/program-state.json spec/development-state/dependency-state.json spec/development-state/frontier-state.json spec/governance/future-roadmap.json spec/work-orders/WORK-069.md .github/workflows/work-069-finalize.yml
          git commit -m 'governance: finalize WORK-069 after merge'
          git push origin governance/WORK-069-post-merge-finalization
