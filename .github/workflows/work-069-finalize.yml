name: WORK-069 post-merge finalization

on:
  push:
    branches:
      - governance/WORK-069-post-merge-finalization

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/WORK-069-post-merge-finalization
          fetch-depth: 0

      - name: Reconcile canonical governance state
        env:
          MERGE_SHA: 62475bea2366e9377fe2fc42b57f58c639296974
          APPROVED_HEAD: 8ab2d6410d582642487f389ffd0ba010d729b559
          PR_NUMBER: "108"
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          MERGE_SHA = "62475bea2366e9377fe2fc42b57f58c639296974"
          APPROVED_HEAD = "8ab2d6410d582642487f389ffd0ba010d729b559"
          PR = 108
          NOW = "2026-09-01T05:40:42Z"

          def readj(p): return json.loads(Path(p).read_text())
          def writej(p, x): Path(p).write_text(json.dumps(x, indent=2) + "\n")

          # Canonical program state: WORK-069 merged -> complete, merge evidence recorded,
          # active handoff removed. Preserve historical prose and append finalization truth.
          p = "spec/development-state/program-state.json"
          d = readj(p)
          for w in d["workOrders"]:
              if w.get("id") == "WORK-069":
                  w["status"] = "complete"
                  w["mergedAs"] = {"pr": PR, "mergeCommit": MERGE_SHA}
                  w.pop("branch", None)
          cg = d["currentGeneration"]
          cg["completedWorkOrders"] = 61
          cg["inFlight"] = []
          cg["note"] = f"WORK-069 is COMPLETE + FINALIZED: PR #{PR} merged as {MERGE_SHA} from approved head {APPROVED_HEAD}. The activation handoff is removed; merged work is not resumable. WORK-068 remains a separate in-flight parallel implementation where its canonical state says so."
          d["currentGeneration"] = cg
          d["resumption"]["activeHandoffs"] = [h for h in d["resumption"].get("activeHandoffs", []) if h.get("workOrderId") != "WORK-069"]
          d["asOf"] = f"{NOW} (WORK-069 post-merge finalization: PR #{PR} merged as {MERGE_SHA}, approved head {APPROVED_HEAD}; canonical WORK-069 is complete + finalized, its in-flight handoff is removed. Prior canonical narrative preserved as durable history.)"
          writej(p, d)

          # Derived dependency state.
          p = "spec/development-state/dependency-state.json"
          d = readj(p)
          d["currentGeneration"]["completedWorkOrders"] = 61
          d["currentGeneration"]["inFlight"] = []
          d["currentGeneration"]["note"] = f"WORK-069 is COMPLETE + FINALIZED (PR #{PR}, merge {MERGE_SHA}, approved head {APPROVED_HEAD}); its hard edge for WORK-070 is now satisfied."
          d["futureGeneration"].pop("WORK-069", None)
          d["futureGenerationEligibility"].pop("WORK-069", None)
          d["futureGenerationEligibility"]["WORK-070"] = "eligible — WORK-067, WORK-069, and WORK-051 are complete; soft WORK-055 and WORK-060 remain non-hard dependencies."
          writej(p, d)

          # Frontier state: current main is the merged head; WORK-069 is no longer live.
          p = "spec/development-state/frontier-state.json"
          d = readj(p)
          d["currentMain"] = MERGE_SHA
          d["currentLiveImplementation"] = "WORK-068"
          d["plannedNext"] = [x for x in d.get("plannedNext", []) if x != "WORK-069"]
          if "WORK-070" not in d["plannedNext"]: d["plannedNext"].append("WORK-070")
          d["computedAt"] = NOW + " (WORK-069 post-merge finalization)"
          writej(p, d)

          # Future roadmap: retire WORK-069 from the active sequence/wave; WORK-070 is the next ACR-002 item.
          p = "spec/governance/future-roadmap.json"
          d = readj(p)
          if "sequence" in d:
              d["sequence"] = [x for x in d["sequence"] if x != "WORK-069"]
          if "waves" in d:
              newwaves=[]
              for w in d["waves"]:
                  items=[x for x in w.get("items",[]) if x != "WORK-069"]
                  if items:
                      nw=dict(w); nw["items"]=items; newwaves.append(nw)
              d["waves"]=newwaves
          d["rule"] = d.get("rule", "") + f" WORK-069 was finalized after PR #{PR} merged as {MERGE_SHA}; its hard dependency edge for WORK-070 is satisfied."
          writej(p, d)

          # Work order: preserve implementation history and append the governed finalization record.
          p = Path("spec/work-orders/WORK-069.md")
          text = p.read_text()
          text = text.replace("Status: IN FLIGHT", "Status: COMPLETE + FINALIZED", 1)
          marker = "## Post-merge finalization (2026-09-01 — §34.8 / ADR-0007)"
          if marker not in text:
              text += f"\n\n{marker}\n\nPR #{PR} was merged as `{MERGE_SHA}` from approved head `{APPROVED_HEAD}`. The canonical Work Order state is now `complete` with `mergedAs {{pr: {PR}, mergeCommit: {MERGE_SHA}}}`. Its active implementation handoff is removed because merged work is not resumable. This finalization is governance-only: it does not alter runtime code, add migrations, or activate WORK-070. Prior implementation evidence and review history remain preserved above.\n"
          p.write_text(text)

          # The workflow is intentionally deleted by the same commit after it finishes its job.
          Path(".github/workflows/work-069-finalize.yml").unlink()
          PY

      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/development-state/program-state.json spec/development-state/dependency-state.json spec/development-state/frontier-state.json spec/governance/future-roadmap.json spec/work-orders/WORK-069.md .github/workflows/work-069-finalize.yml
          git commit -m 'governance: finalize WORK-069 after merge'
          git push origin governance/WORK-069-post-merge-finalization
