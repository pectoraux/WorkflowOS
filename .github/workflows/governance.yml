name: Architecture Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate machine-readable governance artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path('spec/development-state/governance-model.json'),
              Path('spec/development-state/program-state.json'),
              Path('spec/development-state/dependency-state.json'),
              Path('spec/development-state/frontier-state.json'),
              Path('spec/development-state/checkpoint-state.json'),
              Path('spec/governance/architect.json'),
              Path('spec/governance/worker-protocol.json'),
              Path('spec/governance/assurance-profiles.json'),
              Path('spec/governance/checkpoint-contract.json'),
              Path('spec/governance/future-roadmap.json'),
              Path('spec/architecture/v1.1/artifact-taxonomy.json'),
          ]
          for path in files:
              json.loads(path.read_text())
          required = [Path(f'spec/work-orders/WORK-{n:03d}.md') for n in range(53, 62)]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing planned Work Orders: ' + ', '.join(missing))
          print('Governance artifacts: valid')
          PY

      - name: Validate architecture evolution boundaries
        shell: bash
        run: |
          set -euo pipefail
          # Positive invariant assertions (the v1.0/v1.1 boundary):
          grep -q 'v1.0 is immutable historical architecture' spec/architecture/v1.1/architecture-lock.md
          grep -q 'ACR approval is required before v1.1 becomes governing' spec/architecture/v1.1/architecture-lock.md
          grep -q 'ACR-001' spec/architecture-change-requests/ACR-001-v1-1-adaptive-engineering-control-system.md
          # The machine-readable roadmap must agree with the machine-readable
          # dependency state, and v1.1 must remain proposed until ACR approval.
          python - <<'PY'
          import json
          roadmap = json.load(open('spec/governance/future-roadmap.json'))
          dep = json.load(open('spec/development-state/dependency-state.json'))
          seq = set(roadmap['sequence'])
          gen = set(dep['futureGeneration'])
          assert seq == gen, (
              'future-roadmap sequence and dependency-state futureGeneration disagree: '
              + str(sorted(seq ^ gen))
          )
          for wave in roadmap['parallelWaves']:
              for item in wave['items']:
                  assert item in seq, f'parallel wave item {item} is not in the sequence'
          assert roadmap['status'] == 'proposed', 'v1.1 must remain proposed until ACR approval'
          print('Evolution boundary checks: valid')
          PY

      - name: Validate persistent authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          architect=json.load(open('spec/governance/architect.json'))
          worker=json.load(open('spec/governance/worker-protocol.json'))
          required = {'workOrder','architectureVersion','dependencies','allowedSurfaces','forbiddenSurfaces','assuranceProfile','checkpointContract','requiredProofs'}
          assert required.issubset(set(worker['requiredContext']))
          assert 'merge-own-pr' in worker['workerMayNot']
          assert 'change-governing-architecture-without-acr' in worker['workerMayNot']
          assert worker['mergeAuthority'] == 'architect'
          assert 'approve-architecture-change' in architect['decisionRights']
          assert 'approve-merge' in architect['decisionRights']
          print('Persistent authority boundaries: valid')
          PY
