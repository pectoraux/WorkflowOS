# WorkflowOS release pipeline (DEPLOYMENT HARDENING).
#
# THE release system for the cloud topology. The existing `deploy.yml`
# remains the validation CI for the frozen LOCAL docker-compose topology;
# this workflow releases and verifies the PRODUCTION topology:
#
#   Vercel (Vite SPA) ← /api/* rewrite ← Railway API (modular monolith,
#   roles api + worker) ← PostgreSQL (authoritative) + Redis (non-authoritative)
#   + Object storage (S3-compatible adapter through the ObjectStore boundary).
#
# Release sequencing (schema → backend → worker → verification → frontend) is
# enforced as a STRICT PIPELINE — every stage `needs` its predecessor, no two
# production stages ever run concurrently:
#
#   backend-contract-gate   (the LIVE backend's /health deployment.commitSha
#                            must be an ancestor of the release commit)
#            ↓
#   railway-api-deploy      (deploys the api role; schema migrations run on
#                            api-role startup)
#            ↓
#   railway-worker-deploy   (deploys the worker role)
#            ↓
#   backend-verification    (the live /health must report the EXACT release
#                            SHA and /health/ready must be fully ready — 200,
#                            every dependency check ok, including the object
#                            store)
#            ↓
#   deploy-frontend         (vercel --prod, then live verification against
#                            the real production URL: SPA shell, assets, deep
#                            links, /api rewrite, backend liveness + readiness,
#                            authenticated read-only call through the full
#                            Browser→Vercel→Railway→PostgreSQL path)
#            ↓
#   deployment-evidence     (immutable per-release evidence: job summary +
#                            artifact; durable repository evidence lives under
#                            docs/deployment/evidence/)
#
# FAIL-CLOSED credentials: a NORMAL production release REQUIRES the
# RAILWAY_TOKEN and VERCEL_TOKEN secrets. A missing credential FAILS the
# release at the stage that needs it (explicit error + the manual recovery
# steps) — the frontend can never ship while the backend deploy or its
# verification was skipped. Visible skips exist ONLY on the PR preview path
# (previews are optional per-PR conveniences that never touch production).
#
# Exceptional transitions (e.g. bootstrap after a long backend freeze, when
# the live backend predates the deployment-identity surface) can be approved
# by the architect through workflow_dispatch with `skip_backend_gate=true` —
# the skip is recorded in the run logs and the deployment evidence and skips
# ONLY the ancestry precheck, never the deploy/verify stages themselves.
#
# RELEASE RECOVERY PROTOCOL — interrupted releases and mixed-revision states.
# The strict pipeline makes every failure mode recoverable by RE-RUNNING the
# workflow (all stages are idempotent: the same SHA is re-pinned, the same
# image is redeployed, verification re-observes the live services):
#
#   1. API deploy fails            → nothing shipped (every later stage is
#                                    skipped via the needs-chain); production
#                                    stays fully on the previous release;
#                                    fix and re-run.
#   2. Worker deploy fails / the
#      run is canceled mid-release → interim state is api(NEW)+worker(OLD).
#                                    This state is SAFE and TRANSIENT: the
#                                    worker is never AHEAD of the api role
#                                    (the api deploy — which owns schema
#                                    migrations — always runs first), and the
#                                    release is INCOMPLETE until the worker's
#                                    observed boot SHA equals the release SHA
#                                    (backend-verification enforces it). Fix
#                                    and re-run; the pipeline re-converges
#                                    both roles onto the release SHA before
#                                    the frontend ships. To instead abandon
#                                    the release, roll the api service back
#                                    to its previous deployment (Railway
#                                    redeploy of the prior deployment ID —
#                                    recorded in the last evidence artifact)
#                                    so both roles return to the same
#                                    revision.
#   3. Restart mid-release         → same as (2): Railway deployments are
#                                    atomic (a new deployment takes over only
#                                    after its build+start succeed), so the
#                                    interrupted stage's service keeps its
#                                    previous healthy deployment until the
#                                    re-run completes it.
#   4. api/worker temporarily on
#      different revisions         → observable, bounded, and one-directional
#                                    (worker never newer than api). The
#                                    release protocol's invariant: a release
#                                    is COMPLETE only when the evidence
#                                    records BOTH roles' observed SHAs equal
#                                    to the release commit AND the frontend
#                                    deployment — a mixed state can never be
#                                    attested as released.
#
# Pull requests:
#   - static checks: vercel configuration invariants + frontend typecheck
#   - a Vercel PREVIEW deployment, verified to be ISOLATED from production
#     (its /api/* must NOT reach the production backend — preview API_TARGET
#     is a non-production canary; see frontend/vercel.ts)
#   - PRs NEVER deploy into production Railway state.
#
# Push to main / workflow_dispatch (the production release path — the strict
# pipeline above; PRs never enter it):
#   - backend-contract-gate → railway-api-deploy → railway-worker-deploy →
#     backend-verification → deploy-frontend → deployment-evidence
#
# Required repository configuration:
#   secrets: VERCEL_TOKEN   (Vercel access token — REQUIRED for releases)
#   secrets: RAILWAY_TOKEN  (Railway PROJECT token for the production project —
#                            REQUIRED for releases)
#   vars:    VERCEL_ORG_ID, VERCEL_PROJECT_ID, PRODUCTION_API_URL
#
# SECURITY: no credentials are committed in this file; all secrets arrive
# through the GitHub Actions secret store.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backend_gate:
        description: 'Skip the backend-contract gate (architect-approved exceptional transition)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Credential presence probe — makes gated stages skip VISIBLY (never
  # silently). Booleans only; no secret values ever cross job boundaries.
  # ---------------------------------------------------------------------------
  credentials:
    name: credential presence
    runs-on: ubuntu-latest
    outputs:
      has_vercel: ${{ steps.probe.outputs.has_vercel }}
      has_railway: ${{ steps.probe.outputs.has_railway }}
    steps:
      - name: Probe release credentials
        id: probe
        run: |
          echo "has_vercel=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_railway=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          echo "Vercel token:  ${{ steps.probe.outputs.has_vercel == 'true' && 'present — Vercel stages ARMED' || 'ABSENT — Vercel stages will SKIP visibly' }}"
          echo "Railway token: ${{ steps.probe.outputs.has_railway == 'true' && 'present — Railway stage ARMED' || 'ABSENT — Railway stage will SKIP visibly' }}"

  # ---------------------------------------------------------------------------
  # Static configuration checks — always run, no credentials required.
  # ---------------------------------------------------------------------------
  frontend-config:
    name: frontend deployment config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Validate Vercel deployment configuration (VC-01..VC-05)
        run: bun scripts/validate-vercel-config.ts

      - name: Frontend typecheck (includes vercel.ts)
        working-directory: frontend
        run: bun run typecheck

  # ---------------------------------------------------------------------------
  # PR preview deployment — isolated from production by construction.
  # ---------------------------------------------------------------------------
  preview:
    name: vercel preview (isolated)
    runs-on: ubuntu-latest
    needs: [frontend-config, credentials]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Deploy Vercel preview
        if: needs.credentials.outputs.has_vercel == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Preview deployments target the ISOLATION CANARY by default: a
          # non-resolving host so /api/* can NEVER reach the production
          # backend (fail-safe separation). Point PREVIEW_API_TARGET at a real
          # preview backend when one exists.
          PREVIEW_API_TARGET: ${{ vars.PREVIEW_API_TARGET }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          API_TARGET="${PREVIEW_API_TARGET:-https://workflowos-preview-canary.invalid}" \
          vercel deploy ./frontend \
            --token "$VERCEL_TOKEN" \
            --confirm 2>/dev/null | tail -n 1 > /tmp/preview-url.txt
          URL=$(cat /tmp/preview-url.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      - name: Verify preview isolation (must NOT reach the production backend)
        if: needs.credentials.outputs.has_vercel == 'true'
        run: |
          FRONTEND_URL="${{ steps.deploy.outputs.url }}" \
          MODE=preview \
          ./scripts/verify-cloud-deployment.sh

      - name: No Vercel token configured — preview skipped (visible)
        if: needs.credentials.outputs.has_vercel != 'true'
        run: |
          echo "::warning::VERCEL_TOKEN secret is not configured — Vercel preview deployment SKIPPED."
          echo "The preview stage arms automatically once the secret exists. This is an explicit skip, not a success claim."

  # ---------------------------------------------------------------------------
  # Backend-contract gate — release sequencing enforcement (main only).
  # ---------------------------------------------------------------------------
  backend-contract-gate:
    name: backend contract gate (release sequencing)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate (backend must be an ancestor of the release)
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          SKIP_BACKEND_GATE: ${{ inputs.skip_backend_gate }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${SKIP_BACKEND_GATE}" = "true" ]; then
            echo "::warning::backend-contract gate SKIPPED by explicit architect decision (workflow_dispatch skip_backend_gate=true). This skip is recorded in the run log and MUST be reflected in the deployment evidence."
            exit 0
          fi
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::PRODUCTION_API_URL repository variable is not set. It must hold the production Railway API origin (e.g. https://workflowos-production.up.railway.app)."
            exit 1
          fi
          echo "Probing production backend: ${PRODUCTION_API_URL}/health"
          HEALTH=$(curl -sS --max-time 30 "${PRODUCTION_API_URL}/health" || echo '{}')
          echo "backend /health: ${HEALTH}"
          BACKEND_SHA=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployment",{}).get("commitSha",""))' 2>/dev/null || echo "")
          if [ -z "${BACKEND_SHA}" ]; then
            echo "::error::The production backend does not report a deployment commit SHA (it predates the deployment-identity surface, or /health is unreachable). RELEASE BLOCKED: a frontend release must not assume a backend contract that is not yet available. Deploy the Railway backend from current main first (see docs/deployment/production.md), or run this workflow from workflow_dispatch with skip_backend_gate=true as an architect-approved exceptional transition."
            exit 1
          fi
          echo "backend commit: ${BACKEND_SHA}"
          echo "release commit: ${RELEASE_SHA}"
          if git cat-file -e "${BACKEND_SHA}"^{commit} 2>/dev/null; then
            if git merge-base --is-ancestor "${BACKEND_SHA}" "${RELEASE_SHA}"; then
              echo "GATE PASSED: backend ${BACKEND_SHA} is an ancestor of release ${RELEASE_SHA}."
            else
              echo "::error::GATE FAILED: backend ${BACKEND_SHA} is NOT an ancestor of release ${RELEASE_SHA} (the live backend contains changes the release does not include). Align the repository first."
              exit 1
            fi
          else
            echo "::error::GATE FAILED: backend commit ${BACKEND_SHA} is not present in this repository. The production backend must be deployed from this repository's main branch."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Railway api-role deployment — STRICT PIPELINE stage 1 after the gate.
  # Schema migrations run on api-role startup, so this stage precedes the
  # worker. Missing Railway credentials FAIL the release (never a skip).
  #
  # IDENTITY CAPTURE: the stage records the AUTHORITATIVE Railway deployment
  # identity (deployment UUID + image digest) for the machine-readable
  # deployment evidence — "which Railway deployment serves this release" is
  # answered by Railway's own deployment record, never by job-log prose.
  # ---------------------------------------------------------------------------
  railway-api-deploy:
    name: deploy railway backend (api role — schema migrations)
    runs-on: ubuntu-latest
    needs: [backend-contract-gate, credentials]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
      image_digest: ${{ steps.identity.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FAIL CLOSED — Railway credentials unavailable
        if: needs.credentials.outputs.has_railway != 'true'
        run: |
          echo "::error::RAILWAY_TOKEN is not configured. A normal production release FAILS CLOSED here: the backend must be deployed and verified BEFORE the frontend ships (release ordering schema → backend → worker → verification → frontend). Nothing downstream will run. Configure the RAILWAY_TOKEN repository secret (a Railway PROJECT token for the production project) and re-run, or perform a manual backend deployment per docs/deployment/production.md, then re-run."
          exit 1

      - name: Deploy Railway api service
        if: needs.credentials.outputs.has_railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli@latest
          # RAILWAY_TOKEN is a Railway PROJECT token bound to the production
          # project; `--service` selects within it. The real service names —
          # verified live with the project token on 2026-08-29 — are
          # `WorkflowOS` (WORKFLOWOS_ROLE=api) and `WorkflowOS-Worker`
          # (WORKFLOWOS_ROLE=worker). One codebase, two roles: the SAME
          # repository backend/Dockerfile serves both roles; the role is
          # selected by each service's WORKFLOWOS_ROLE variable.
          #
          # `railway up` uploads the checkout root; each service's build
          # config (rootDirectory `backend` + Dockerfile) trims to
          # backend/Dockerfile — proven live by the repo-root CLI deployments
          # of 2026-08-29 (identical image digests).
          #
          # CLI uploads carry NO git context: RAILWAY_GIT_COMMIT_SHA is only
          # injected for Git-connected deployments. The release SHA is
          # therefore set as WORKFLOWOS_COMMIT_SHA on BOTH services — /health
          # reports it as deployment.commitSha, which the backend-contract
          # gate and backend-verification check. (--skip-deploys: the `up`
          # below is the deploy; no extra restarts.)
          railway variable set "WORKFLOWOS_COMMIT_SHA=$RELEASE_SHA" --service "WorkflowOS" --skip-deploys
          railway variable set "WORKFLOWOS_COMMIT_SHA=$RELEASE_SHA" --service "WorkflowOS-Worker" --skip-deploys
          # Snapshot the pre-existing deployment IDs so the new deployment is
          # identified by set-difference (no clock assumptions).
          railway deployment list --service "WorkflowOS" --json \
            | python3 -c 'import json,sys; print("\n".join(d["id"] for d in json.load(sys.stdin)))' \
            > /tmp/pre-deployment-ids.txt
          railway up --ci --service "WorkflowOS" || {
            echo "::error::Railway api-service deployment failed — see logs above."
            exit 1
          }

      - name: Capture the Railway api deployment identity
        if: needs.credentials.outputs.has_railway == 'true'
        id: identity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          # `railway up` returns when the build log stream ends; the rollout
          # may still be converging. Poll until THIS release's deployment
          # (a NEW deployment id, absent from the pre-deploy snapshot) is
          # SUCCESS — the stage asserts Railway's own record of the rollout,
          # then records it as the authoritative deployment identity.
          DEPLOYMENT_ID=""
          IMAGE_DIGEST=""
          STATUS=""
          for _ in $(seq 1 60); do
            railway deployment list --service "WorkflowOS" --json > /tmp/deployments.json 2>/dev/null || true
            read -r DEPLOYMENT_ID IMAGE_DIGEST STATUS <<< "$(python3 - <<'PY' /tmp/deployments.json /tmp/pre-deployment-ids.txt
          import json, sys
          deployments = json.load(open(sys.argv[1]))
          pre = set(open(sys.argv[2]).read().split())
          for d in deployments:
              if d.get("id") in pre:
                  continue  # a pre-existing deployment — never this release's
              print(d.get("id", ""), d.get("meta", {}).get("imageDigest", "") or "-", d.get("status", ""))
              break
          PY
          )"
            if [ -n "$DEPLOYMENT_ID" ] && [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            echo "waiting for the api deployment ${DEPLOYMENT_ID:-pending} to reach SUCCESS (status: ${STATUS:-unknown})…"
            sleep 15
          done
          if [ -z "$DEPLOYMENT_ID" ] || [ "$STATUS" != "SUCCESS" ]; then
            echo "::error::Could not confirm a SUCCESS Railway deployment for the api service (last status: ${STATUS:-none}). RELEASE BLOCKED — the deployment identity cannot be recorded."
            exit 1
          fi
          [ "$IMAGE_DIGEST" != "-" ] || IMAGE_DIGEST=unknown
          echo "api deployment identity: id=$DEPLOYMENT_ID digest=$IMAGE_DIGEST"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Railway worker-role deployment — STRICT PIPELINE stage 2 (after the api
  # role, whose startup runs the schema migrations the worker depends on).
  #
  # IDENTITY CAPTURE (worker-specific): the worker serves NO HTTP by design
  # (backend/src/index.ts — only the api role builds the Fastify server), so
  # its live revision cannot be probed over HTTP. The OBSERVED SHA therefore
  # comes from the worker's own boot log: the process logs
  # `app.process.starting … commitSha=<sha>` at startup (all roles), and this
  # stage reads that line from the JUST-DEPLOYED deployment's logs. The
  # evidence records what the RUNNING PROCESS attests — never the merely
  # configured variable value.
  # ---------------------------------------------------------------------------
  railway-worker-deploy:
    name: deploy railway backend (worker role)
    runs-on: ubuntu-latest
    # `credentials` is needed here explicitly: this job's fail-closed guard
    # reads needs.credentials.outputs.has_railway, and a job that does not
    # `need` the credentials job sees an EMPTY context (undefined != 'true'
    # would then fail every run — exactly the defect found by the first live
    # pipeline execution on 2026-08-29).
    needs: [railway-api-deploy, credentials]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
      image_digest: ${{ steps.identity.outputs.image_digest }}
      observed_sha: ${{ steps.identity.outputs.observed_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FAIL CLOSED — Railway credentials unavailable (defense in depth)
        if: needs.credentials.outputs.has_railway != 'true'
        run: |
          echo "::error::RAILWAY_TOKEN is not configured (railway-api-deploy should already have failed the release — this guard exists so the ordering can never regress)."
          exit 1

      - name: Deploy Railway worker service
        if: needs.credentials.outputs.has_railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli@latest
          # Snapshot the pre-existing deployment IDs so the new deployment is
          # identified by set-difference (no clock assumptions).
          railway deployment list --service "WorkflowOS-Worker" --json \
            | python3 -c 'import json,sys; print("\n".join(d["id"] for d in json.load(sys.stdin)))' \
            > /tmp/pre-deployment-ids.txt
          railway up --ci --service "WorkflowOS-Worker" || {
            echo "::error::Railway worker-service deployment failed — see logs above."
            exit 1
          }

      - name: Capture the Railway worker deployment identity + observed SHA
        if: needs.credentials.outputs.has_railway == 'true'
        id: identity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=""
          IMAGE_DIGEST=""
          STATUS=""
          for _ in $(seq 1 60); do
            railway deployment list --service "WorkflowOS-Worker" --json > /tmp/deployments.json 2>/dev/null || true
            read -r DEPLOYMENT_ID IMAGE_DIGEST STATUS <<< "$(python3 - <<'PY' /tmp/deployments.json /tmp/pre-deployment-ids.txt
          import json, sys
          deployments = json.load(open(sys.argv[1]))
          pre = set(open(sys.argv[2]).read().split())
          for d in deployments:
              if d.get("id") in pre:
                  continue  # a pre-existing deployment — never this release's
              print(d.get("id", ""), d.get("meta", {}).get("imageDigest", "") or "-", d.get("status", ""))
              break
          PY
          )"
            if [ -n "$DEPLOYMENT_ID" ] && [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            echo "waiting for the worker deployment ${DEPLOYMENT_ID:-pending} to reach SUCCESS (status: ${STATUS:-unknown})…"
            sleep 15
          done
          if [ -z "$DEPLOYMENT_ID" ] || [ "$STATUS" != "SUCCESS" ]; then
            echo "::error::Could not confirm a SUCCESS Railway deployment for the worker service (last status: ${STATUS:-none}). RELEASE BLOCKED — the deployment identity cannot be recorded."
            exit 1
          fi
          [ "$IMAGE_DIGEST" != "-" ] || IMAGE_DIGEST=unknown
          # OBSERVED SHA: the running worker process attests its revision in
          # the deployment's own logs (app.process.starting … commitSha=<sha>).
          # Retry: log ingestion lags the rollout by a few seconds.
          OBSERVED_SHA=""
          for _ in $(seq 1 12); do
            railway logs "$DEPLOYMENT_ID" --lines 200 > /tmp/worker-logs.txt 2>/dev/null || true
            OBSERVED_SHA=$(grep 'app\.process\.starting' /tmp/worker-logs.txt \
              | grep -oE '[0-9a-f]{40}' | head -n 1 || true)
            if [ -n "$OBSERVED_SHA" ]; then break; fi
            echo "waiting for the worker boot identity log line…"
            sleep 10
          done
          if [ -z "$OBSERVED_SHA" ]; then
            echo "::error::The deployed worker did not log its boot identity (app.process.starting with commitSha). The worker's live revision CANNOT be observed — RELEASE BLOCKED (an unobservable deployment is unverifiable)."
            exit 1
          fi
          echo "worker deployment identity: id=$DEPLOYMENT_ID digest=$IMAGE_DIGEST observedSha=$OBSERVED_SHA"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "observed_sha=$OBSERVED_SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Live backend verification — STRICT PIPELINE stage 3: the deployed backend
  # must report the EXACT release SHA and be fully ready (including the object
  # store) before the frontend may ship. This is the enforcement point of the
  # release-ordering guarantee. The observed API identity + readiness are
  # emitted as outputs — the machine-readable deployment evidence records
  # what the LIVE service reported, not what the pipeline intended.
  # ---------------------------------------------------------------------------
  backend-verification:
    name: verify live backend (identity + readiness)
    runs-on: ubuntu-latest
    needs: [railway-worker-deploy]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      observed_sha: ${{ steps.verify.outputs.observed_sha }}
      readiness_json: ${{ steps.verify.outputs.readiness_json }}
      worker_observed_sha: ${{ needs.railway-worker-deploy.outputs.observed_sha }}
    steps:
      - name: Verify the live production backend
        id: verify
        env:
          RELEASE_SHA: ${{ github.sha }}
          WORKER_OBSERVED_SHA: ${{ needs.railway-worker-deploy.outputs.observed_sha }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::PRODUCTION_API_URL repository variable is not set — cannot verify the live backend contract."
            exit 1
          fi
          # Cross-role revision coordination: within a release the worker is
          # never ahead of the api role. Both roles were pinned to the
          # release SHA before their deploys; the worker's OBSERVED boot SHA
          # must equal the release SHA — a mismatch means the worker is NOT
          # running this release (unverifiable mixed state → block).
          if [ -n "${WORKER_OBSERVED_SHA}" ] && [ "${WORKER_OBSERVED_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Worker revision coordination FAILED: the worker's observed boot SHA (${WORKER_OBSERVED_SHA}) does not equal the release SHA (${RELEASE_SHA}). RELEASE BLOCKED."
            exit 1
          fi
          # Identity: /health must report deployment.commitSha == RELEASE_SHA.
          # (The deploy stages return when their build logs end; the rollout
          # may still be converging, hence the retry loops.)
          BACKEND_SHA=""
          for _ in $(seq 1 30); do
            HEALTH=$(curl -sS --max-time 15 "${PRODUCTION_API_URL}/health" || echo '{}')
            BACKEND_SHA=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployment",{}).get("commitSha",""))' 2>/dev/null || echo "")
            if [ "$BACKEND_SHA" = "$RELEASE_SHA" ]; then
              echo "backend identity verified: /health deployment.commitSha = $RELEASE_SHA"
              break
            fi
            echo "waiting for the live backend to report the release SHA (got '${BACKEND_SHA:-none}')…"
            sleep 10
          done
          if [ "$BACKEND_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::The production backend does not report the released commit SHA (got '${BACKEND_SHA:-none}'). RELEASE BLOCKED: the frontend must not ship against an unverified backend. Inspect the Railway deployment logs."
            exit 1
          fi
          # Readiness: /health/ready must be 200 with EVERY dependency check
          # ok — postgres, redis, AND the object store. A not-ready backend
          # blocks the release (fail-closed), whatever the failing check is.
          READY=""
          READY_JSON="{}"
          for _ in $(seq 1 30); do
            READY_CODE=$(curl -sS --max-time 15 -o /tmp/wfos-ready.json -w '%{http_code}' "${PRODUCTION_API_URL}/health/ready" || echo 000)
            if [ "$READY_CODE" = "200" ]; then
              READY=ok
              READY_JSON=$(cat /tmp/wfos-ready.json)
              break
            fi
            echo "waiting for backend readiness (HTTP $READY_CODE: $(head -c 300 /tmp/wfos-ready.json 2>/dev/null))…"
            sleep 10
          done
          if [ "$READY" != "ok" ]; then
            echo "::error::Backend readiness is not 200 — a dependency check is failing (postgres / redis / objectStore). RELEASE BLOCKED. Last response: $(head -c 400 /tmp/wfos-ready.json 2>/dev/null)"
            exit 1
          fi
          echo "backend readiness verified: all dependency checks ok (postgres, redis, objectStore)"
          cat /tmp/wfos-ready.json
          echo "observed_sha=$BACKEND_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "readiness_json<<WFOS_READY_EOF"
            echo "$READY_JSON"
            echo "WFOS_READY_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Production frontend deployment + live verification — STRICT PIPELINE stage
  # 4: only after the backend is deployed AND verified live.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: deploy vercel production
    runs-on: ubuntu-latest
    needs: [backend-verification, credentials]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: FAIL CLOSED — Vercel credentials unavailable
        if: needs.credentials.outputs.has_vercel != 'true'
        run: |
          echo "::error::VERCEL_TOKEN is not configured. A normal production release FAILS CLOSED here (the backend is already deployed and verified; the frontend cannot ship without it). Configure the VERCEL_TOKEN repository secret and re-run, or deploy manually: vercel deploy ./frontend --prod (see docs/deployment/production.md), then re-run for the verification stages."
          exit 1

      - name: Deploy Vercel production
        if: needs.credentials.outputs.has_vercel == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          # vercel.ts compiles at the deploy invocation and reads API_TARGET —
          # the production origin comes from the PRODUCTION_API_URL variable
          # (the same value the backend-contract gate probes).
          API_TARGET="${PRODUCTION_API_URL}" \
          vercel deploy ./frontend \
            --prod \
            --token "$VERCEL_TOKEN" \
            --confirm 2>/dev/null | tail -n 1 > /tmp/prod-url.txt
          URL=$(cat /tmp/prod-url.txt)
          echo "Production deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Resolve the Vercel deployment ID for the identity record — the
          # deployment-evidence job FAILS on an empty ID, so resolve with a
          # fallback: `vercel inspect` on the URL, else the project's most
          # recent production deployment.
          ID=$(vercel inspect "$URL" --token "$VERCEL_TOKEN" 2>/dev/null | grep -oE 'dpl_[A-Za-z0-9]+' | head -n 1 || true)
          if [ -z "$ID" ]; then
            echo "inspect did not yield a dpl_ id — falling back to vercel ls"
            ID=$(vercel ls ./frontend --prod --token "$VERCEL_TOKEN" 2>/dev/null | grep -oE 'dpl_[A-Za-z0-9]+' | head -n 1 || true)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not resolve the Vercel deployment ID for $URL — the deployment identity cannot be recorded."
            exit 1
          fi
          echo "vercel deployment id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Verify the live production deployment
        if: needs.credentials.outputs.has_vercel == 'true'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          API_KEY=$(grep -oE "wfos-demo-[a-z0-9-]+" backend/provision-key.ts | head -n 1 || echo "")
          FRONTEND_URL="${{ steps.deploy.outputs.url }}" \
          API_URL="${PRODUCTION_API_URL}" \
          API_KEY="${API_KEY}" \
          MODE=production \
          REQUIRE_READY=1 \
          ./scripts/verify-cloud-deployment.sh

  # ---------------------------------------------------------------------------
  # Deployment evidence — the authoritative machine-readable per-release
  # identity record. It needs EVERY strict-pipeline stage DIRECTLY (so every
  # stage's outputs are readable) and FAILS if the record is incomplete: the
  # durable cross-provider provenance
  #
  #   release commit ↔ Vercel deployment ↔ Railway api deployment
  #                  ↔ Railway worker deployment
  #
  # is recorded from each provider's OWN deployment record (Vercel deployment
  # ID; Railway deployment UUIDs + image digests) plus what the LIVE services
  # themselves reported (api /health commitSha; worker boot-log commitSha) —
  # never from job-log prose. An interrupted release CANNOT produce a partial
  # evidence record: this job runs only when every stage succeeded.
  # ---------------------------------------------------------------------------
  deployment-evidence:
    name: deployment evidence (cross-provider identity record)
    runs-on: ubuntu-latest
    needs:
      - railway-api-deploy
      - railway-worker-deploy
      - backend-verification
      - deploy-frontend
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Record the cross-provider deployment identity
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERCEL_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
          VERCEL_ID: ${{ needs.deploy-frontend.outputs.deployment_id }}
          API_DEPLOYMENT_ID: ${{ needs.railway-api-deploy.outputs.deployment_id }}
          API_IMAGE_DIGEST: ${{ needs.railway-api-deploy.outputs.image_digest }}
          API_OBSERVED_SHA: ${{ needs.backend-verification.outputs.observed_sha }}
          WORKER_DEPLOYMENT_ID: ${{ needs.railway-worker-deploy.outputs.deployment_id }}
          WORKER_IMAGE_DIGEST: ${{ needs.railway-worker-deploy.outputs.image_digest }}
          WORKER_OBSERVED_SHA: ${{ needs.railway-worker-deploy.outputs.observed_sha }}
          READINESS_JSON: ${{ needs.backend-verification.outputs.readiness_json }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          # WRITE_JSON: compose the record; python re-parses the readiness
          # body (multi-line) safely instead of string-interpolating it.
          export RELEASE_SHA RELEASE_REF RELEASE_EVENT RUN_ID RUN_URL \
                 VERCEL_URL VERCEL_ID API_DEPLOYMENT_ID API_IMAGE_DIGEST \
                 API_OBSERVED_SHA WORKER_DEPLOYMENT_ID WORKER_IMAGE_DIGEST \
                 WORKER_OBSERVED_SHA READINESS_JSON PRODUCTION_API_URL
          python3 - <<'PY' > evidence/deployment-evidence.json
          import json, os, datetime
          def env(k): return os.environ.get(k, "")
          record = {
              "schemaVersion": 2,
              "releasedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releaseCommit": env("RELEASE_SHA"),
              "releaseRef": env("RELEASE_REF"),
              "releaseEvent": env("RELEASE_EVENT"),
              "run": {"id": env("RUN_ID"), "url": env("RUN_URL")},
              "frontend": {
                  "provider": "vercel",
                  "deploymentUrl": env("VERCEL_URL"),
                  "deploymentId": env("VERCEL_ID"),
              },
              "backend": {
                  "provider": "railway",
                  "api": {
                      "service": "WorkflowOS",
                      "deploymentId": env("API_DEPLOYMENT_ID"),
                      "imageDigest": env("API_IMAGE_DIGEST"),
                      "observedSha": env("API_OBSERVED_SHA"),
                      "observedVia": "live GET /health deployment.commitSha",
                      "healthUrl": env("PRODUCTION_API_URL") + "/health",
                  },
                  "worker": {
                      "service": "WorkflowOS-Worker",
                      "deploymentId": env("WORKER_DEPLOYMENT_ID"),
                      "imageDigest": env("WORKER_IMAGE_DIGEST"),
                      "observedSha": env("WORKER_OBSERVED_SHA"),
                      "observedVia": "live deployment boot log (app.process.starting commitSha) — the worker serves no HTTP by design",
                  },
              },
              "verification": {
                  "backendIdentity": "live /health deployment.commitSha == releaseCommit",
                  "backendReadiness": json.loads(env("READINESS_JSON") or "{}"),
                  "frontendLive": "SPA shell + /api rewrite + authenticated read-only round trip through Vercel -> Railway -> PostgreSQL (deploy-frontend job)",
              },
          }
          print(json.dumps(record, indent=2))
          PY
          # VALIDATE: the record is AUTHORITATIVE by construction — a missing
          # or uncoordinated identity FAILS this job (an incomplete record is
          # worse than none: it would launder an interrupted release into
          # "evidence").
          python3 - <<'PY'
          import json, sys
          rec = json.load(open("evidence/deployment-evidence.json"))
          problems = []
          def required(node, key, label):
              value = str(node.get(key, "") or "").strip()
              if not value or value.lower() in ("unknown", "none", "null"):
                  problems.append(f"{label} is missing/empty")
          required(rec, "releaseCommit", "releaseCommit")
          required(rec["frontend"], "deploymentId", "frontend.deploymentId (Vercel)")
          required(rec["frontend"], "deploymentUrl", "frontend.deploymentUrl")
          required(rec["backend"]["api"], "deploymentId", "backend.api.deploymentId (Railway)")
          required(rec["backend"]["api"], "observedSha", "backend.api.observedSha")
          required(rec["backend"]["worker"], "deploymentId", "backend.worker.deploymentId (Railway)")
          required(rec["backend"]["worker"], "observedSha", "backend.worker.observedSha")
          release = rec.get("releaseCommit", "")
          for role in ("api", "worker"):
              observed = rec["backend"][role].get("observedSha", "")
              if observed and release and observed != release:
                  problems.append(f"backend.{role}.observedSha ({observed}) != releaseCommit ({release}) — cross-provider provenance is UNCOORDINATED")
          readiness = rec["verification"]["backendReadiness"]
          if readiness.get("status") != "ready":
              problems.append(f"backendReadiness is not 'ready': {json.dumps(readiness)[:200]}")
          else:
              for dep, check in (readiness.get("checks") or {}).items():
                  if not check.get("ok"):
                      problems.append(f"readiness check '{dep}' is not ok")
          if problems:
              print("::error::Deployment identity record is INCOMPLETE or UNCOORDINATED — refusing to attest this release:")
              for p in problems:
                  print(f"::error::  - {p}")
              sys.exit(1)
          print("deployment identity record validated: all provider identities present, observed SHAs == releaseCommit, readiness ready")
          PY
          cat evidence/deployment-evidence.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Durable repository evidence: docs/deployment/evidence/ (updated by delivery pull requests)._"
          echo "_This artifact is the machine-readable cross-provider identity record (schemaVersion 2); the run URL ties it to the exact pipeline execution._"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
