# WorkflowOS release pipeline (DEPLOYMENT HARDENING).
#
# THE release system for the cloud topology. The existing `deploy.yml`
# remains the validation CI for the frozen LOCAL docker-compose topology;
# this workflow releases and verifies the PRODUCTION topology:
#
#   Vercel (Vite SPA) ← /api/* rewrite ← Railway API (modular monolith,
#   roles api + worker) ← PostgreSQL (authoritative) + Redis (non-authoritative)
#   + Object storage (S3-compatible adapter through the ObjectStore boundary).
#
# Release sequencing (schema → backend → worker → verification → frontend) is
# enforced as a STRICT PIPELINE — every stage `needs` its predecessor, no two
# production stages ever run concurrently:
#
#   backend-contract-gate   (the LIVE backend's /health deployment.commitSha
#                            must be an ancestor of the release commit)
#            ↓
#   railway-api-deploy      (deploys the api role; schema migrations run on
#                            api-role startup)
#            ↓
#   railway-worker-deploy   (deploys the worker role)
#            ↓
#   backend-verification    (the live /health must report the EXACT release
#                            SHA and /health/ready must be fully ready — 200,
#                            every dependency check ok, including the object
#                            store)
#            ↓
#   deploy-frontend         (vercel --prod, then live verification against
#                            the real production URL: SPA shell, assets, deep
#                            links, /api rewrite, backend liveness + readiness,
#                            authenticated read-only call through the full
#                            Browser→Vercel→Railway→PostgreSQL path)
#            ↓
#   deployment-evidence     (immutable per-release evidence: job summary +
#                            artifact; durable repository evidence lives under
#                            docs/deployment/evidence/)
#
# FAIL-CLOSED credentials: a NORMAL production release REQUIRES the
# RAILWAY_TOKEN and VERCEL_TOKEN secrets. A missing credential FAILS the
# release at the stage that needs it (explicit error + the manual recovery
# steps) — the frontend can never ship while the backend deploy or its
# verification was skipped. Visible skips exist ONLY on the PR preview path
# (previews are optional per-PR conveniences that never touch production).
#
# Exceptional transitions (e.g. bootstrap after a long backend freeze, when
# the live backend predates the deployment-identity surface) can be approved
# by the architect through workflow_dispatch with `skip_backend_gate=true` —
# the skip is recorded in the run logs and the deployment evidence and skips
# ONLY the ancestry precheck, never the deploy/verify stages themselves.
#
# Pull requests:
#   - static checks: vercel configuration invariants + frontend typecheck
#   - a Vercel PREVIEW deployment, verified to be ISOLATED from production
#     (its /api/* must NOT reach the production backend — preview API_TARGET
#     is a non-production canary; see frontend/vercel.ts)
#   - PRs NEVER deploy into production Railway state.
#
# Push to main / workflow_dispatch (the production release path — the strict
# pipeline above; PRs never enter it):
#   - backend-contract-gate → railway-api-deploy → railway-worker-deploy →
#     backend-verification → deploy-frontend → deployment-evidence
#
# Required repository configuration:
#   secrets: VERCEL_TOKEN   (Vercel access token — REQUIRED for releases)
#   secrets: RAILWAY_TOKEN  (Railway PROJECT token for the production project —
#                            REQUIRED for releases)
#   vars:    VERCEL_ORG_ID, VERCEL_PROJECT_ID, PRODUCTION_API_URL
#
# SECURITY: no credentials are committed in this file; all secrets arrive
# through the GitHub Actions secret store.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backend_gate:
        description: 'Skip the backend-contract gate (architect-approved exceptional transition)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Credential presence probe — makes gated stages skip VISIBLY (never
  # silently). Booleans only; no secret values ever cross job boundaries.
  # ---------------------------------------------------------------------------
  credentials:
    name: credential presence
    runs-on: ubuntu-latest
    outputs:
      has_vercel: ${{ steps.probe.outputs.has_vercel }}
      has_railway: ${{ steps.probe.outputs.has_railway }}
    steps:
      - name: Probe release credentials
        id: probe
        run: |
          echo "has_vercel=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "has_railway=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          echo "Vercel token:  ${{ steps.probe.outputs.has_vercel == 'true' && 'present — Vercel stages ARMED' || 'ABSENT — Vercel stages will SKIP visibly' }}"
          echo "Railway token: ${{ steps.probe.outputs.has_railway == 'true' && 'present — Railway stage ARMED' || 'ABSENT — Railway stage will SKIP visibly' }}"

  # ---------------------------------------------------------------------------
  # Static configuration checks — always run, no credentials required.
  # ---------------------------------------------------------------------------
  frontend-config:
    name: frontend deployment config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Validate Vercel deployment configuration (VC-01..VC-05)
        run: bun scripts/validate-vercel-config.ts

      - name: Frontend typecheck (includes vercel.ts)
        working-directory: frontend
        run: bun run typecheck

  # ---------------------------------------------------------------------------
  # PR preview deployment — isolated from production by construction.
  # ---------------------------------------------------------------------------
  preview:
    name: vercel preview (isolated)
    runs-on: ubuntu-latest
    needs: [frontend-config, credentials]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Deploy Vercel preview
        if: needs.credentials.outputs.has_vercel == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          # Preview deployments target the ISOLATION CANARY by default: a
          # non-resolving host so /api/* can NEVER reach the production
          # backend (fail-safe separation). Point PREVIEW_API_TARGET at a real
          # preview backend when one exists.
          PREVIEW_API_TARGET: ${{ vars.PREVIEW_API_TARGET }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          API_TARGET="${PREVIEW_API_TARGET:-https://workflowos-preview-canary.invalid}" \
          vercel deploy ./frontend \
            --token "$VERCEL_TOKEN" \
            --confirm 2>/dev/null | tail -n 1 > /tmp/preview-url.txt
          URL=$(cat /tmp/preview-url.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      - name: Verify preview isolation (must NOT reach the production backend)
        if: needs.credentials.outputs.has_vercel == 'true'
        run: |
          FRONTEND_URL="${{ steps.deploy.outputs.url }}" \
          MODE=preview \
          ./scripts/verify-cloud-deployment.sh

      - name: No Vercel token configured — preview skipped (visible)
        if: needs.credentials.outputs.has_vercel != 'true'
        run: |
          echo "::warning::VERCEL_TOKEN secret is not configured — Vercel preview deployment SKIPPED."
          echo "The preview stage arms automatically once the secret exists. This is an explicit skip, not a success claim."

  # ---------------------------------------------------------------------------
  # Backend-contract gate — release sequencing enforcement (main only).
  # ---------------------------------------------------------------------------
  backend-contract-gate:
    name: backend contract gate (release sequencing)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (full history for ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate (backend must be an ancestor of the release)
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          SKIP_BACKEND_GATE: ${{ inputs.skip_backend_gate }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${SKIP_BACKEND_GATE}" = "true" ]; then
            echo "::warning::backend-contract gate SKIPPED by explicit architect decision (workflow_dispatch skip_backend_gate=true). This skip is recorded in the run log and MUST be reflected in the deployment evidence."
            exit 0
          fi
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::PRODUCTION_API_URL repository variable is not set. It must hold the production Railway API origin (e.g. https://workflowos-production.up.railway.app)."
            exit 1
          fi
          echo "Probing production backend: ${PRODUCTION_API_URL}/health"
          HEALTH=$(curl -sS --max-time 30 "${PRODUCTION_API_URL}/health" || echo '{}')
          echo "backend /health: ${HEALTH}"
          BACKEND_SHA=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployment",{}).get("commitSha",""))' 2>/dev/null || echo "")
          if [ -z "${BACKEND_SHA}" ]; then
            echo "::error::The production backend does not report a deployment commit SHA (it predates the deployment-identity surface, or /health is unreachable). RELEASE BLOCKED: a frontend release must not assume a backend contract that is not yet available. Deploy the Railway backend from current main first (see docs/deployment/production.md), or run this workflow from workflow_dispatch with skip_backend_gate=true as an architect-approved exceptional transition."
            exit 1
          fi
          echo "backend commit: ${BACKEND_SHA}"
          echo "release commit: ${RELEASE_SHA}"
          if git cat-file -e "${BACKEND_SHA}"^{commit} 2>/dev/null; then
            if git merge-base --is-ancestor "${BACKEND_SHA}" "${RELEASE_SHA}"; then
              echo "GATE PASSED: backend ${BACKEND_SHA} is an ancestor of release ${RELEASE_SHA}."
            else
              echo "::error::GATE FAILED: backend ${BACKEND_SHA} is NOT an ancestor of release ${RELEASE_SHA} (the live backend contains changes the release does not include). Align the repository first."
              exit 1
            fi
          else
            echo "::error::GATE FAILED: backend commit ${BACKEND_SHA} is not present in this repository. The production backend must be deployed from this repository's main branch."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Railway api-role deployment — STRICT PIPELINE stage 1 after the gate.
  # Schema migrations run on api-role startup, so this stage precedes the
  # worker. Missing Railway credentials FAIL the release (never a skip).
  # ---------------------------------------------------------------------------
  railway-api-deploy:
    name: deploy railway backend (api role — schema migrations)
    runs-on: ubuntu-latest
    needs: [backend-contract-gate, credentials]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FAIL CLOSED — Railway credentials unavailable
        if: needs.credentials.outputs.has_railway != 'true'
        run: |
          echo "::error::RAILWAY_TOKEN is not configured. A normal production release FAILS CLOSED here: the backend must be deployed and verified BEFORE the frontend ships (release ordering schema → backend → worker → verification → frontend). Nothing downstream will run. Configure the RAILWAY_TOKEN repository secret (a Railway PROJECT token for the production project) and re-run, or perform a manual backend deployment per docs/deployment/production.md, then re-run."
          exit 1

      - name: Deploy Railway api service
        if: needs.credentials.outputs.has_railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli@latest
          # RAILWAY_TOKEN is a Railway PROJECT token bound to the production
          # project; `--service` selects within it. The real service names —
          # verified live with the project token on 2026-08-29 — are
          # `WorkflowOS` (WORKFLOWOS_ROLE=api) and `WorkflowOS-Worker`
          # (WORKFLOWOS_ROLE=worker). One codebase, two roles: the SAME
          # repository backend/Dockerfile serves both roles; the role is
          # selected by each service's WORKFLOWOS_ROLE variable.
          #
          # `railway up` uploads the checkout root; each service's build
          # config (rootDirectory `backend` + Dockerfile) trims to
          # backend/Dockerfile — proven live by the repo-root CLI deployments
          # of 2026-08-29 (identical image digests).
          #
          # CLI uploads carry NO git context: RAILWAY_GIT_COMMIT_SHA is only
          # injected for Git-connected deployments. The release SHA is
          # therefore set as WORKFLOWOS_COMMIT_SHA on BOTH services — /health
          # reports it as deployment.commitSha, which the backend-contract
          # gate and backend-verification check. (--skip-deploys: the `up`
          # below is the deploy; no extra restarts.)
          railway variable set "WORKFLOWOS_COMMIT_SHA=$RELEASE_SHA" --service "WorkflowOS" --skip-deploys
          railway variable set "WORKFLOWOS_COMMIT_SHA=$RELEASE_SHA" --service "WorkflowOS-Worker" --skip-deploys
          railway up --ci --service "WorkflowOS" || {
            echo "::error::Railway api-service deployment failed — see logs above."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Railway worker-role deployment — STRICT PIPELINE stage 2 (after the api
  # role, whose startup runs the schema migrations the worker depends on).
  # ---------------------------------------------------------------------------
  railway-worker-deploy:
    name: deploy railway backend (worker role)
    runs-on: ubuntu-latest
    needs: [railway-api-deploy]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FAIL CLOSED — Railway credentials unavailable (defense in depth)
        if: needs.credentials.outputs.has_railway != 'true'
        run: |
          echo "::error::RAILWAY_TOKEN is not configured (railway-api-deploy should already have failed the release — this guard exists so the ordering can never regress)."
          exit 1

      - name: Deploy Railway worker service
        if: needs.credentials.outputs.has_railway == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli@latest
          railway up --ci --service "WorkflowOS-Worker" || {
            echo "::error::Railway worker-service deployment failed — see logs above."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Live backend verification — STRICT PIPELINE stage 3: the deployed backend
  # must report the EXACT release SHA and be fully ready (including the object
  # store) before the frontend may ship. This is the enforcement point of the
  # release-ordering guarantee.
  # ---------------------------------------------------------------------------
  backend-verification:
    name: verify live backend (identity + readiness)
    runs-on: ubuntu-latest
    needs: [railway-worker-deploy]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify the live production backend
        env:
          RELEASE_SHA: ${{ github.sha }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_API_URL}" ]; then
            echo "::error::PRODUCTION_API_URL repository variable is not set — cannot verify the live backend contract."
            exit 1
          fi
          # Identity: /health must report deployment.commitSha == RELEASE_SHA.
          # (The deploy stages return when their build logs end; the rollout
          # may still be converging, hence the retry loops.)
          BACKEND_SHA=""
          for _ in $(seq 1 30); do
            HEALTH=$(curl -sS --max-time 15 "${PRODUCTION_API_URL}/health" || echo '{}')
            BACKEND_SHA=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deployment",{}).get("commitSha",""))' 2>/dev/null || echo "")
            if [ "$BACKEND_SHA" = "$RELEASE_SHA" ]; then
              echo "backend identity verified: /health deployment.commitSha = $RELEASE_SHA"
              break
            fi
            echo "waiting for the live backend to report the release SHA (got '${BACKEND_SHA:-none}')…"
            sleep 10
          done
          if [ "$BACKEND_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::The production backend does not report the released commit SHA (got '${BACKEND_SHA:-none}'). RELEASE BLOCKED: the frontend must not ship against an unverified backend. Inspect the Railway deployment logs."
            exit 1
          fi
          # Readiness: /health/ready must be 200 with EVERY dependency check
          # ok — postgres, redis, AND the object store. A not-ready backend
          # blocks the release (fail-closed), whatever the failing check is.
          READY=""
          for _ in $(seq 1 30); do
            READY_CODE=$(curl -sS --max-time 15 -o /tmp/wfos-ready.json -w '%{http_code}' "${PRODUCTION_API_URL}/health/ready" || echo 000)
            if [ "$READY_CODE" = "200" ]; then
              READY=ok
              break
            fi
            echo "waiting for backend readiness (HTTP $READY_CODE: $(head -c 300 /tmp/wfos-ready.json 2>/dev/null))…"
            sleep 10
          done
          if [ "$READY" != "ok" ]; then
            echo "::error::Backend readiness is not 200 — a dependency check is failing (postgres / redis / objectStore). RELEASE BLOCKED. Last response: $(head -c 400 /tmp/wfos-ready.json 2>/dev/null)"
            exit 1
          fi
          echo "backend readiness verified: all dependency checks ok (postgres, redis, objectStore)"
          cat /tmp/wfos-ready.json

  # ---------------------------------------------------------------------------
  # Production frontend deployment + live verification — STRICT PIPELINE stage
  # 4: only after the backend is deployed AND verified live.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: deploy vercel production
    runs-on: ubuntu-latest
    needs: [backend-verification, credentials]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: FAIL CLOSED — Vercel credentials unavailable
        if: needs.credentials.outputs.has_vercel != 'true'
        run: |
          echo "::error::VERCEL_TOKEN is not configured. A normal production release FAILS CLOSED here (the backend is already deployed and verified; the frontend cannot ship without it). Configure the VERCEL_TOKEN repository secret and re-run, or deploy manually: vercel deploy ./frontend --prod (see docs/deployment/production.md), then re-run for the verification stages."
          exit 1

      - name: Deploy Vercel production
        if: needs.credentials.outputs.has_vercel == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          # vercel.ts compiles at the deploy invocation and reads API_TARGET —
          # the production origin comes from the PRODUCTION_API_URL variable
          # (the same value the backend-contract gate probes).
          API_TARGET="${PRODUCTION_API_URL}" \
          vercel deploy ./frontend \
            --prod \
            --token "$VERCEL_TOKEN" \
            --confirm 2>/dev/null | tail -n 1 > /tmp/prod-url.txt
          URL=$(cat /tmp/prod-url.txt)
          echo "Production deployed: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Resolve the deployment ID for the evidence record.
          ID=$(vercel inspect "$URL" --token "$VERCEL_TOKEN" 2>/dev/null | grep -oE 'dpl_[A-Za-z0-9]+' | head -n 1 || echo "")
          echo "id=${ID:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Verify the live production deployment
        if: needs.credentials.outputs.has_vercel == 'true'
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          API_KEY=$(grep -oE "wfos-demo-[a-z0-9-]+" backend/provision-key.ts | head -n 1 || echo "")
          FRONTEND_URL="${{ steps.deploy.outputs.url }}" \
          API_URL="${PRODUCTION_API_URL}" \
          API_KEY="${API_KEY}" \
          MODE=production \
          REQUIRE_READY=1 \
          ./scripts/verify-cloud-deployment.sh

  # ---------------------------------------------------------------------------
  # Deployment evidence — immutable per-release record (summary + artifact).
  # ---------------------------------------------------------------------------
  deployment-evidence:
    name: deployment evidence
    runs-on: ubuntu-latest
    # deploy-frontend is the LAST stage of the strict pipeline — needing it
    # transitively requires every Railway stage and its verification to have
    # succeeded.
    needs: [deploy-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Record release evidence
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEPLOYMENT_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
          DEPLOYMENT_ID: ${{ needs.deploy-frontend.outputs.deployment_id }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          mkdir -p evidence
          cat > evidence/deployment-evidence.json <<EOF
          {
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseCommit": "${RELEASE_SHA}",
            "frontend": {
              "deploymentUrl": "${DEPLOYMENT_URL}",
              "deploymentId": "${DEPLOYMENT_ID}"
            },
            "backend": {
              "productionApiUrl": "${PRODUCTION_API_URL}",
              "automatedDeploy": "see railway-backend job (visible skip when RAILWAY_TOKEN absent)"
            },
            "verification": "see deploy-frontend job (live production verification) and railway-backend job"
          }
          EOF
          cat evidence/deployment-evidence.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Durable repository evidence: docs/deployment/evidence/ (updated by delivery pull requests)._"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 90
