name: WORK-043 remediation TDD

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/work-043-remediation-tdd.yml'

permissions:
  contents: read

jobs:
  tdd-architecture-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Run WORK-043 remediation regressions
        working-directory: backend
        run: bunx vitest run tests/architecture/work-043-remediation.test.ts
