name: One-shot WORK-022 evidence rerun

on:
  push:
    branches: [chore/reconcile-work-019-work-022-state]

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Backend install
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Backend governance status
        working-directory: backend
        run: bun run governance:status
      - name: Backend typecheck
        working-directory: backend
        run: bun run typecheck
      - name: Backend lint
        working-directory: backend
        run: bun run lint
      - name: Backend architecture checks
        working-directory: backend
        run: bun run arch:check
      - name: Backend full test suite
        working-directory: backend
        run: bun run test

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Frontend lint
        working-directory: frontend
        run: bun run lint
      - name: Frontend production build
        working-directory: frontend
        run: bun run build
      - name: Frontend rendered-UI tests
        working-directory: frontend
        run: bun run test

      - name: Prove final tree is unchanged by this verification harness
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short
          git config user.name "workflowos-architect"
          git config user.email "architect@workflowos.invalid"
          git rm .github/workflows/one-shot-work-022-evidence.yml
          git commit -m "chore(governance): record WORK-022 evidence harness completion"
          git push origin HEAD:chore/reconcile-work-019-work-022-state
