name: ig006-rebuild-bootstrap
on:
  push:
    branches: [feat/ig-006-cross-device-attestation-v2]
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rebuild IG-006 from the historical blocked gate
        shell: bash
        env:
          HISTORICAL_BRANCH: feat/ig-006-cross-device-attestation
        run: |
          set -euo pipefail
          git fetch origin "$HISTORICAL_BRANCH"
          git checkout "origin/$HISTORICAL_BRANCH" -- \
            backend/tests/integration/integration-gates/ig-006-cross-device-attestation.integration.test.ts \
            backend/tests/integration/integration-gates/run-ig-006-dogfooding.ts \
            spec/architecture/v2/dogfooding-evidence/IG-006-cross-device-attestation.md

          python3 - <<'PY'
          from pathlib import Path
          import re

          test = Path('backend/tests/integration/integration-gates/ig-006-cross-device-attestation.integration.test.ts')
          dog = Path('backend/tests/integration/integration-gates/run-ig-006-dogfooding.ts')

          def common_runtime_patch(s: str) -> str:
              s = s.replace(
                  "function nodeRuntime(\n  nodes: TriggerTestStack['nodes'],\n  attestation: ComputerAgentPolicy['attestation'],\n): ComputerAgentRuntime {",
                  "function nodeRuntime(\n  nodes: TriggerTestStack['nodes'],\n  attestation: ComputerAgentPolicy['attestation'],\n  dependentStepIds: readonly string[] = [],\n): ComputerAgentRuntime {",
              )
              s = s.replace("      attestation,\n    },", "      attestation,\n      dependentStepIds,\n    },")
              return s

          s = common_runtime_patch(test.read_text())
          s = s.replace("  type ResumeAfterHumanInput,\n", "")
          s = s.replace("  type StepAttestationMaterial,\n", "")
          s = s.replace("  validateExecutionStatement,\n", "")
          s = s.replace("  signExecutionAttestation,\n", "")
          s = s.replace("  EXECUTION_STATEMENT_OBJECT_TYPE,\n", "")
          s = s.replace("  EXECUTION_STATEMENT_SCHEMA_VERSION,\n", "")
          s = s.replace("  type ExecutionStatement,\n", "")
          s = s.replace("  type VerifiedExecutionFact,\n", "  type VerifiedExecutionFact,\n  type DependentStepPrecondition,\n")

          # Main-path admission: consume Node-B's independent V2-014 fact at the actual resume boundary.
          marker = "    const fact: VerifiedExecutionFact = admission.fact;\n"
          inject = marker + """    const digestA = bindingA.executionDigest;\n    const dependentPrecondition: DependentStepPrecondition = {\n      dependentStepId: 'record_ack',\n      predecessorAttestationId: fact.attestationId,\n      verifiedPredecessor: fact,\n      causalParentDigests: [digestA],\n      runId,\n      workflowVersionId: pinned.versionId,\n      workflowVersionSemanticDigest: semanticDigest,\n    };\n"""
          if marker not in s:
              raise SystemExit('integration marker for fact not found')
          s = s.replace(marker, inject, 1)

          old_runtime = """    const runtimeB = nodeRuntime(support.nodes, {\n      required: true,\n      trustedAttesterKeyIds: [keyA.keyId, keyB.keyId],\n      validityMs: 3_600_000,\n    });\n    const reportB = await runtimeB.resumeAfterHuman(t.principal, {\n      runId,\n      hosts: [hostB as ComputerHostAdapter],\n      humanOutcome: 'approved',\n      humanUserId: operatorUserId,\n      decider: createAckWriteDecider(),\n    });"""
          new_runtime = """    const runtimeB = nodeRuntime(support.nodes, {\n      required: true,\n      trustedAttesterKeyIds: [keyA.keyId, keyB.keyId],\n      validityMs: 3_600_000,\n    }, ['record_ack']);\n    const reportB = await runtimeB.resumeAfterHuman(t.principal, {\n      runId,\n      hosts: [hostB as ComputerHostAdapter],\n      humanOutcome: 'approved',\n      humanUserId: operatorUserId,\n      decider: createAckWriteDecider(),\n      preconditions: [dependentPrecondition],\n    });"""
          if old_runtime not in s:
              raise SystemExit('integration runtimeB block not found')
          s = s.replace(old_runtime, new_runtime, 1)

          # Replace the old synthetic P5 verifier probe + P5b gap pin with verification of the REAL runtime-produced dependent attestation.
          start = s.find("    // --- P5a. the V2-014 verifier ENFORCES the causalParents dimension ------")
          end = s.find("    // --- P9 (pre-duplicate snapshot). the execution history ----------------")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('integration P5 section markers not found')
          replacement = """    // --- P5. the ACTUAL runtime-produced dependent attestation carries Node A's execution digest.
    const digestA = durableA.executionDigest;\n    expect(durableB.statement.causalParents).toEqual([digestA]);\n    const causalOk = verifyAttestation(attestationB, {\n      bindings: { runId, attemptId: 1, stepId: 'record_ack', causalParents: [digestA] },\n      freshness: { now: support.clock.utc(), currentEpoch: TRIGGER_TEST_EPOCH, replayRegistry: new InMemoryReplayRegistry() },\n      attesterKeyIds: [keyB.keyId],\n    });\n    expect(causalOk.ok, JSON.stringify(causalOk)).toBe(true);\n    const causalWrong = verifyAttestation(attestationB, {\n      bindings: { runId, attemptId: 1, stepId: 'record_ack', causalParents: [sha256Of('wrong-parent-digest')] },\n      freshness: { now: support.clock.utc(), currentEpoch: TRIGGER_TEST_EPOCH, replayRegistry: new InMemoryReplayRegistry() },\n      attesterKeyIds: [keyB.keyId],\n    });\n    expect(causalWrong.ok).toBe(false);\n    if (!causalWrong.ok) {\n      expect(causalWrong.failure.code).toBe('ATTESTATION_BINDING_MISMATCH');\n      expect(causalWrong.failure.dimension).toBe('causalParents');\n    }\n\n"""
          s = s[:start] + replacement + s[end:]

          # Replace the historical P3b gap test body with a real fail-closed admission regression on the public resume surface.
          start = s.find("  it('P3b (UNSATISFIED DEPENDENCY — admission coupling):")
          end = s.find("  it('P8:", start)
          if start < 0 or end < 0:
              raise SystemExit('integration P3b test markers not found')
          replacement = """  it('P3b: missing verified predecessor admission fails closed before the dependent side effect', async () => {\n    const t = await freshGateTenant('admission-fail-closed');\n    const nodes = support.freshNodes();\n    const keyA = generateAttesterKeyPair();\n    const keyB = generateAttesterKeyPair();\n    const browserEnvironment = new ScriptedBrowserEnvironment([{\n      url: FORM_URL,\n      elements: [\n        { elementId: 'btn-submit', kind: 'button', label: 'Submit', state: 'enabled' },\n        { elementId: 'input-notes', kind: 'input', label: 'Notes', state: '' },\n      ],\n    }]);\n    const desktopEnvironment = new ScriptedDesktopEnvironment({ directories: ['reports'] });\n    const hostA = attachWebHost(keyA, browserEnvironment, nodes);\n    const hostB = attachDesktopHost(keyB, desktopEnvironment, nodes);\n    const pinned = await createCrossDeviceWorkflow(t, 'ig6-admission-fail-closed', authorCrossDeviceDocument());\n    const requested = await support.runs.requestRun(\n      t.principal,\n      { commandId: 'cmd-ig006-admission-fail-closed', correlationId: 'corr-ig006-admission-fail-closed' },\n      { organizationId: t.organizationId, workflowId: pinned.workflowId, versionId: pinned.versionId, trigger: { type: 'manual', id: 'ig006-admission-fail-closed' }, inputCommitments: [sha256Of('ig006-admission-fail-closed')] },\n    );\n    const runId = requested.result.run.id;\n    const runtimeA = nodeRuntime(nodes, { required: true, trustedAttesterKeyIds: [keyA.keyId], validityMs: 300_000 });\n    const reportA = await runtimeA.executeRun(t.principal, { runId, hosts: [hostA as ComputerHostAdapter], decider: createBrowserSubmitDecider(), workflowInputs: { formUrl: FORM_URL } });\n    expect(reportA.state).toBe('paused');\n    const runtimeB = nodeRuntime(nodes, { required: true, trustedAttesterKeyIds: [keyA.keyId, keyB.keyId], validityMs: 3_600_000 }, ['record_ack']);\n    const reportB = await runtimeB.resumeAfterHuman(t.principal, { runId, hosts: [hostB as ComputerHostAdapter], humanOutcome: 'approved', humanUserId: operatorUserId, decider: createAckWriteDecider() });\n    expect(reportB.state).toBe('failed');\n    expect(reportB.failure?.code).toBe('AGENT_PRECONDITION_REJECTED');\n    expect(desktopEnvironment.readFile(ACK_PATH)).toBeNull();\n    const history = await support.runs.getRunHistory(t.principal, runId);\n    expect(history.run.state).toBe('failed');\n    expect(history.invocations.filter((invocation) => invocation.capability === 'filesystem.write')).toHaveLength(0);\n  });\n\n"""
          s = s[:start] + replacement + s[end:]

          # Update stale terminology in comments/descriptions without changing semantics elsewhere.
          s = s.replace('GATE VERDICT: FAIL — 2 UNSATISFIED DEPENDENCIES', 'GATE VERDICT: PASS — V2-016 admission coupling re-proven')
          s = s.replace('P5a+P5b-gap', 'P5-runtime-causal-chain')
          s = s.replace('P3a, P4, P5a+P5b-gap', 'P3, P4, P5')
          s = s.replace('UNSATISFIED DEPENDENCY', 'historical dependency')
          test.write_text(s)

          s = common_runtime_patch(dog.read_text())
          s = s.replace("  type ComputerHostAdapter,\n", "  type ComputerHostAdapter,\n  type DependentStepPrecondition,\n")

          # Main-path admission in the standalone runner.
          marker = "    const admissionFact = admission.ok ? admission.fact : null;\n"
          inject = marker + """    const digestAForAdmission = historyAfterA.attestations[0]!.executionDigest;\n    const dependentPrecondition: DependentStepPrecondition | null = admissionFact === null ? null : {\n      dependentStepId: 'record_ack',\n      predecessorAttestationId: admissionFact.attestationId,\n      verifiedPredecessor: admissionFact,\n      causalParentDigests: [digestAForAdmission],\n      runId,\n      workflowVersionId: versionId,\n      workflowVersionSemanticDigest: semanticDigest,\n    };\n"""
          if marker not in s:
              raise SystemExit('dogfood admissionFact marker not found')
          s = s.replace(marker, inject, 1)

          old_runtime = """    const runtimeB = nodeRuntime(support.nodes, {\n      required: true,\n      trustedAttesterKeyIds: [keyA.keyId, keyB.keyId],\n      validityMs: 3_600_000,\n    });\n    const reportB = await runtimeB.resumeAfterHuman(principal, {\n      runId,\n      hosts: [hostB as ComputerHostAdapter],\n      humanOutcome: 'approved',\n      humanUserId: operator.id,\n      decider: createAckWriteDecider(),\n    });"""
          new_runtime = """    const runtimeB = nodeRuntime(support.nodes, {\n      required: true,\n      trustedAttesterKeyIds: [keyA.keyId, keyB.keyId],\n      validityMs: 3_600_000,\n    }, ['record_ack']);\n    const reportB = await runtimeB.resumeAfterHuman(principal, {\n      runId,\n      hosts: [hostB as ComputerHostAdapter],\n      humanOutcome: 'approved',\n      humanUserId: operator.id,\n      decider: createAckWriteDecider(),\n      preconditions: dependentPrecondition === null ? [] : [dependentPrecondition],\n    });"""
          if old_runtime not in s:
              raise SystemExit('dogfood runtimeB block not found')
          s = s.replace(old_runtime, new_runtime, 1)

          # Replace synthetic causal probe with verification of the actual dependent runtime statement.
          start = s.find("    // The causal legs, SPLIT per the PR #152 correction:")
          end = s.find("    section(`${runLabel} — 6. DISCONNECT/RECONNECT + REPLAY", start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('dogfood P5 section markers not found')
          replacement = """    // The ACTUAL dependent runtime attestation is parent-bound to Node A's execution digest.\n    const historyMid = await support.runs.getRunHistory(principal, runId);\n    const durableA = historyMid.attestations.find((binding) => binding.stepId === 'collect')!;\n    const durableB = historyMid.attestations.find((binding) => binding.stepId === 'record_ack')!;\n    const digestA = durableA.executionDigest;\n    const runtimeCausalParents = (durableB.statement as { causalParents: readonly string[] }).causalParents;\n    const causalOk = verifyAttestation(attestationB, {\n      bindings: { runId, attemptId: 1, stepId: 'record_ack', causalParents: [digestA] },\n      freshness: { now: support.clock.utc(), currentEpoch: TRIGGER_TEST_EPOCH, replayRegistry: new InMemoryReplayRegistry() },\n      attesterKeyIds: [keyB.keyId],\n    });\n    const causalWrong = verifyAttestation(attestationB, {\n      bindings: { runId, attemptId: 1, stepId: 'record_ack', causalParents: [sha256Of('wrong-parent-digest')] },\n      freshness: { now: support.clock.utc(), currentEpoch: TRIGGER_TEST_EPOCH, replayRegistry: new InMemoryReplayRegistry() },\n      attesterKeyIds: [keyB.keyId],\n    });\n    check(\n      '5.runtime-causal-parent-bound',\n      JSON.stringify(runtimeCausalParents) === JSON.stringify([digestA]) && causalOk.ok === true && causalWrong.ok === false && (causalWrong.ok ? null : causalWrong.failure.code) === 'ATTESTATION_BINDING_MISMATCH',\n      'the REAL V2-008 dependent execution carries EXACTLY Node A\'s execution digest in the canonical V2-014 causalParents field; the same attestation is rejected under a wrong-parent expectation',\n    );\n\n"""
          s = s[:start] + replacement + s[end:]

          # Convert the old fail-open gap probe to a fail-closed missing-precondition probe.
          s = s.replace(
              "const probeRuntimeB = nodeRuntime(support.nodes, { required: true, trustedAttesterKeyIds: [keyB.keyId], validityMs: 3_600_000 });",
              "const probeRuntimeB = nodeRuntime(support.nodes, { required: true, trustedAttesterKeyIds: [keyB.keyId], validityMs: 3_600_000 }, ['record_ack']);",
          )
          s = s.replace("    const probeAckWritten = existsSync(probeAckFile) && readFileSync(probeAckFile, 'utf8') === PROBE_ACK_CONTENT;", "    const probeAckWritten = existsSync(probeAckFile) && readFileSync(probeAckFile, 'utf8') === PROBE_ACK_CONTENT;")
          old_check = """        probeReportB.state === 'completed' &&\n        probeAckWritten &&\n        probeHistory.run.state === 'completed' &&\n        probeHistory.attestations.length === 2,"""
          new_check = """        probeReportB.state === 'failed' &&\n        probeReportB.failure?.code === 'AGENT_PRECONDITION_REJECTED' &&\n        probeAckWritten === false &&\n        probeHistory.run.state === 'failed' &&\n        probeHistory.invocations.filter((invocation) => invocation.capability === 'filesystem.write').length === 0,"""
          if old_check not in s:
              raise SystemExit('dogfood probe assertion block not found')
          s = s.replace(old_check, new_check, 1)
          s = s.replace('GATE VERDICT: FAIL — 2 UNSATISFIED DEPENDENCIES (P3b admission coupling, P5b runtime causal chain)', 'GATE VERDICT: PASS — P3 admission coupling and P5 runtime causal chain re-proven')
          s = s.replace('Exit codes: 3 = the fail-closed verdict (all machine-checkable checks green and deterministic, both gaps machine-confirmed present); 1 = an experiment check failed or determinism broke; 0 = unreachable while the gaps are present (the gap checks fail loudly the moment an owning module adds the real coupling, forcing this gate to be revisited — the runner is self-invalidating by design).', 'Exit codes: 0 = all machine-checkable checks green and deterministic; 1 = an experiment check failed or determinism broke.')
          s = s.replace('this execution is NOT structurally gated on the section-4 verification', 'this execution IS structurally gated on the verified predecessor precondition from section 4')
          s = s.replace('the admission coupling gap is section 9', 'the fail-closed missing-precondition regression is section 9')
          dog.write_text(s)
          PY

          # Remove the one-shot bootstrap workflow before committing the real re-proof.
          rm .github/workflows/ig006-rebuild.yml

          # Targeted verification of the re-proof and standalone dogfooding.
          cd backend
          bun install --frozen-lockfile
          bun test tests/integration/integration-gates/ig-006-cross-device-attestation.integration.test.ts
          bunx tsx tests/integration/integration-gates/run-ig-006-dogfooding.ts > /tmp/ig006-dogfood.log 2>&1
          cat /tmp/ig006-dogfood.log
          bunx tsc --noEmit
          bunx eslint tests/integration/integration-gates/ig-006-cross-device-attestation.integration.test.ts tests/integration/integration-gates/run-ig-006-dogfooding.ts

          cd ..
          cat > spec/architecture/v2/dogfooding-evidence/IG-006-cross-device-attestation.md <<'EOF'
          # IG-006 — Cross-Device Execution Attestation Composition

          **Verdict: PASS — re-proven on `main` after V2-016.**

          This evidence supersedes the historical blocked PR #152 attempt without rebasing or mutating that branch.

          ## Proof carried by the re-proof

          - The same durable Run and WorkflowVersion identity is preserved across Node A and Node B.
          - Node A executes through the real ComputerAgentRuntime and produces a real Ed25519 ExecutionAttestation that is durably attached through V2-005.
          - The transferred canonical V2-014 envelope is independently verified under Node B's verifier context.
          - The resulting `VerifiedExecutionFact` is passed into `resumeAfterHuman` as the V2-016 `DependentStepPrecondition` and is consumed before the dependent host side effect.
          - Node B's actual runtime-produced statement carries exactly Node A's execution digest in `causalParents`; the canonical verifier accepts the correct parent and rejects a wrong parent.
          - Freshness/replay, epoch, assurance, trust, capability-versus-authorization, duplicate event, duplicate attach, duplicate host invocation, and durable evidence/reference reconstruction remain covered by the gate.
          - A missing dependent precondition now fails closed with `AGENT_PRECONDITION_REJECTED` and produces zero filesystem-write side effects.

          ## Historical disposition

          PR #152 remains the historical blocked attempt on the pre-V2-016 base. The re-proof branch is a fresh lineage from the post-V2-016 `main` commit and does not rebase or rewrite the historical branch.

          ## Verification commands

          The bootstrap workflow ran the dedicated IG-006 integration test, the standalone dogfooding runner, TypeScript typecheck, and scoped ESLint. The full repository backend CI remains the final merge gate on the resulting PR.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/integration/integration-gates/ig-006-cross-device-attestation.integration.test.ts \
            backend/tests/integration/integration-gates/run-ig-006-dogfooding.ts \
            spec/architecture/v2/dogfooding-evidence/IG-006-cross-device-attestation.md
          git commit -m "IG-006 — re-prove cross-device composition after V2-016"
          git push origin HEAD
