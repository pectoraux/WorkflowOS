name: WORK-069 post-merge finalization (reconciled)

on:
  push:
    branches:
      - governance/work-069-finalization-reconciled

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/work-069-finalization-reconciled
          fetch-depth: 0

      - name: Apply canonical finalization
        env:
          MERGE_SHA: 62475bea2366e9377fe2fc42b57f58c639296974
          APPROVED_HEAD: 8ab2d6410d582642487f389ffd0ba010d729b559
          CURRENT_MAIN: 2097827f03bc7581b321c9b20f3dff653a4fb12a
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          merge_sha = "62475bea2366e9377fe2fc42b57f58c639296974"
          approved_head = "8ab2d6410d582642487f389ffd0ba010d729b559"
          current_main = "2097827f03bc7581b321c9b20f3dff653a4fb12a"
          pr = 108
          as_of = "2026-09-01T18:40:00Z"

          def load(path):
              return json.loads(Path(path).read_text())
          def save(path, data):
              Path(path).write_text(json.dumps(data, indent=2) + "\n")

          # program-state: finalize only WORK-069 while preserving existing
          # canonical identities, including the WORK-019/022 reconciliation.
          path = Path("spec/development-state/program-state.json")
          data = load(path)
          rows = [w for w in data["workOrders"] if w.get("id") == "WORK-069"]
          assert len(rows) == 1, len(rows)
          row = rows[0]
          assert row.get("status") == "in_flight", row.get("status")
          row["status"] = "complete"
          row["mergedAs"] = {"pr": pr, "mergeCommit": merge_sha}
          row.pop("branch", None)
          data["resumption"]["activeHandoffs"] = [
              h for h in data["resumption"].get("activeHandoffs", [])
              if h.get("workOrderId") != "WORK-069"
          ]
          # Verify the prior reconciliation survives this union.
          for work_id, expected in {
              "WORK-019": "ced0867ae4f0965d6eb60c4cdb680d7accefd00a",
              "WORK-022": "ffce8fba1e8b0eec5fc8153fb8ed6678f646b3b0",
          }.items():
              check = next(w for w in data["workOrders"] if w["id"] == work_id)
              assert check["mergedAs"]["mergeCommit"] == expected, (work_id, check["mergedAs"])
          data["asOf"] = (
              f"{as_of} (WORK-069 post-merge finalization: PR #{pr} merged as {merge_sha}, "
              f"approved head {approved_head}; canonical main is {current_main}. "
              "WORK-069 is complete + finalized and its handoff is removed. "
              "Prior canonical narrative preserved as durable history.)"
          )
          save(path, data)

          # dependency-state: WORK-069 leaves the active generation; WORK-070's
          # hard edge becomes satisfied. Keep the mainline current-generation
          # truth, and remove WORK-069 from eligibility.
          path = Path("spec/development-state/dependency-state.json")
          data = load(path)
          data["currentGeneration"]["completedWorkOrders"] = 61
          data["currentGeneration"]["inFlight"] = []
          data["currentGeneration"]["note"] = (
              f"WORK-069 is COMPLETE + FINALIZED (PR #{pr}, merge {merge_sha}, approved head {approved_head}, "
              f"canonical main {current_main}); its hard edge for WORK-070 is now satisfied."
          )
          data["futureGenerationEligibility"].pop("WORK-069", None)
          data["futureGenerationEligibility"]["WORK-070"] = (
              "eligible — WORK-067, WORK-069, and WORK-051 are complete; "
              "soft WORK-055 and WORK-060 remain non-hard dependencies."
          )
          save(path, data)

          # frontier-state: keep currentMain pinned to the actual current main,
          # not the older WORK-069 merge commit.
          path = Path("spec/development-state/frontier-state.json")
          data = load(path)
          data["currentMain"] = current_main
          data["currentLiveImplementation"] = "none — NOTHING is in flight (61/61 recorded work orders complete)"
          data["liveImplementationNote"] = (
              f"WORK-069 was MERGED as {merge_sha} via PR #{pr} and FINALIZED by this governance update. "
              f"Current main is {current_main}; no Work Order is currently in flight. "
              "WORK-068 remains dependency-eligible and planned; WORK-070 is now dependency-eligible and planned."
          )
          data["plannedNext"] = [x for x in data.get("plannedNext", []) if x != "WORK-069"]
          for item in ["WORK-053", "WORK-068", "WORK-070"]:
              if item not in data["plannedNext"]:
                  data["plannedNext"].append(item)
          data["plannedNextNote"] = (
              "Dependency-eligible planned heads are WORK-053, WORK-068, and WORK-070. "
              "WORK-053 remains gated by the architect's prior ACR-001 verdict; WORK-068 is the remaining "
              "ACR-002 wave-10 partner; WORK-070's WORK-069 hard edge is now satisfied. Activation is separate and explicit."
          )
          data["computedAt"] = as_of + " (WORK-069 post-merge finalization on canonical main)"
          save(path, data)

          # future-roadmap: WORK-069 is no longer future; WORK-070 remains.
          path = Path("spec/governance/future-roadmap.json")
          data = load(path)
          if "sequence" in data:
              data["sequence"] = [x for x in data["sequence"] if x != "WORK-069"]
          for key in ("waves", "parallelWaves"):
              if key in data:
                  for wave in data[key]:
                      if isinstance(wave, dict):
                          wave["items"] = [x for x in wave.get("items", []) if x != "WORK-069"]
          marker = f"WORK-069 was finalized after PR #{pr} merged as {merge_sha}"
          rule = data.get("rule", "")
          if marker not in rule:
              data["rule"] = rule.rstrip() + f" {marker}; its hard dependency edge for WORK-070 is satisfied."
          save(path, data)

          # Work Order: finalize status and append evidence; preserve activation
          # and review history.
          path = Path("spec/work-orders/WORK-069.md")
          text = path.read_text()
          if "Status: COMPLETE + FINALIZED" not in text:
              text = text.replace("Status: IN FLIGHT", "Status: COMPLETE + FINALIZED", 1)
          marker = "## Post-merge finalization (2026-09-01 — §34.8 / ADR-0007)"
          if marker not in text:
              text += (
                  f"\n\n{marker}\n\n"
                  f"PR #{pr} was merged as `{merge_sha}` from approved head `{approved_head}`. "
                  f"Canonical state is now `complete` with `mergedAs {{pr: {pr}, mergeCommit: {merge_sha}}}`. "
                  "The active handoff is removed because merged work is not resumable. "
                  f"The canonical mainline at finalization is `{current_main}`. "
                  "This governance update introduces no runtime code, migration, or WORK-070 implementation.\n"
              )
          path.write_text(text)
          PY

      - name: Validate finalization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("spec/development-state/program-state.json").read_text())
          w = next(w for w in p["workOrders"] if w["id"] == "WORK-069")
          assert w["status"] == "complete"
          assert w["mergedAs"] == {"pr": 108, "mergeCommit": "62475bea2366e9377fe2fc42b57f58c639296974"}
          assert next(w for w in p["workOrders"] if w["id"] == "WORK-019")["mergedAs"]["mergeCommit"] == "ced0867ae4f0965d6eb60c4cdb680d7accefd00a"
          assert next(w for w in p["workOrders"] if w["id"] == "WORK-022")["mergedAs"]["mergeCommit"] == "ffce8fba1e8b0eec5fc8153fb8ed6678f646b3b0"
          assert all(h.get("workOrderId") != "WORK-069" for h in p["resumption"]["activeHandoffs"])
          d = json.loads(Path("spec/development-state/dependency-state.json").read_text())
          assert d["currentGeneration"]["inFlight"] == []
          assert "WORK-069" not in d["futureGenerationEligibility"]
          assert d["futureGenerationEligibility"]["WORK-070"].startswith("eligible")
          f = json.loads(Path("spec/development-state/frontier-state.json").read_text())
          assert f["currentMain"] == "2097827f03bc7581b321c9b20f3dff653a4fb12a"
          assert f["currentLiveImplementation"].startswith("none")
          assert all(x in f["plannedNext"] for x in ["WORK-053", "WORK-068", "WORK-070"])
          print("WORK-069 reconciled finalization validated")
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/work-069-finalize-reconciled.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spec/development-state/program-state.json spec/development-state/dependency-state.json spec/development-state/frontier-state.json spec/governance/future-roadmap.json spec/work-orders/WORK-069.md
          git commit -m 'governance: finalize WORK-069 after merge'
          git push origin governance/work-069-finalization-reconciled
